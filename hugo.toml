baseURL = "https://news.rozoom.app/"
title = "Rozoom News"
theme = "PaperMod"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableEmoji = false
buildDrafts = false
buildFuture = false
summaryLength = 30
[pagination]
  pagerSize = 10
timeZone = "Europe/Zurich"

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = true
[markup.highlight]
  noClasses = false
  codeFences = true
  guessSyntax = true
  lineNos = false

[taxonomies]
  tag = "tags"

[params]
  env = "production"
  description = "Self-hosting, Kubernetes and cloud infrastructure, written from production servers."
  keywords = ["self-hosting", "kubernetes", "hetzner", "vps", "docker"]
  images = ["/og-default.png"]
  DateFormat = "2006-01-02"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowLastMod = true
  defaultTheme = "auto"
  disableThemeToggle = false
  hidemeta = false
  comments = false
  # self-hosted umami on the same box, cookie-less
  umamiScriptUrl = "https://stats.rozoom.app/script.js"
  umamiWebsiteId = "9f750516-e1ba-45ad-90e4-b1389fcc115c"
  newsletterAction = ""
  # Google AdSense: empty client id = no ad code on the site at all.
  # Fill adsenseClient after the account is approved, then the slot ids.
  adsenseClient = ""
  adsenseSlotInArticle = ""
  adsenseSlotBelowPost = ""
  # policy pages stay ad-free
  adsenseExcludeSlugs = ["about", "privacy", "affiliate-disclosure", "contact"]
  # hard ceiling on manual units per post, per the project rules
  adsenseMaxPerPost = 3

[params.homeInfoParams]
  Title = "Notes from real servers"
  Content = "Self-hosting, Kubernetes and cloud infrastructure. Every guide is run on a machine we pay for."

[params.assets]
  disableHLJS = true
  favicon = "/favicon.ico"
  favicon32x32 = "/favicon-32x32.png"
  apple_touch_icon = "/apple-touch-icon.png"

