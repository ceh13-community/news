baseURL = "https://news.rozoom.app/"
title = "Rozoom News"
theme = "PaperMod"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableEmoji = false
buildDrafts = false
buildFuture = false
summaryLength = 30
[pagination]
  pagerSize = 10
timeZone = "Europe/Zurich"

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = true
[markup.highlight]
  noClasses = false
  codeFences = true
  guessSyntax = true
  lineNos = false

[taxonomies]
  tag = "tags"

[params]
  env = "production"
  author = "U_DAW"
  description = "Self-hosting, Kubernetes and Swiss cloud, written from production servers."
  keywords = ["self-hosting", "kubernetes", "hetzner", "switzerland", "privacy"]
  images = ["/og-default.png"]
  DateFormat = "2006-01-02"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowLastMod = true
  defaultTheme = "auto"
  disableThemeToggle = false
  hidemeta = false
  comments = false
  # analytics + newsletter endpoints are filled in once the services are live
  umamiScriptUrl = ""
  umamiWebsiteId = ""
  newsletterAction = ""

[params.homeInfoParams]
  Title = "Notes from real servers"
  Content = "Self-hosting, Kubernetes and Swiss cloud services. Every guide is run on a machine we pay for."

[params.assets]
  disableHLJS = true
  favicon = "/favicon.ico"
  favicon32x32 = "/favicon-32x32.png"
  apple_touch_icon = "/apple-touch-icon.png"

